kind = "web"
previewPath = "/"
title = "Wentex"
version = "1.0.0"
id = "artifacts/wentex"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20126

[services.development]
run = "pnpm --filter @workspace/wentex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wentex", "run", "build" ]
serve = "static"
publicDir = "artifacts/wentex/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20126"
BASE_PATH = "/"
